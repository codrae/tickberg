groups:
  - name: tickberg-1a
    interval: 30s
    rules:
      - alert: KisWebSocketDown
        expr: kis_ws_connected == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "KIS WebSocket disconnected for 5m"
          description: "장 시간대 라면 종목 데이터 손실 중 (장 마감 후 무시 가능)."

      - alert: ProducerParseErrorSpike
        expr: increase(kis_parse_errors_total[5m]) > 100
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "KIS parse error rate elevated (>100/5m)"
          description: "KIS payload 포맷 변경 또는 producer 버그 의심. 컨트롤 프레임 로그 확인."

      - alert: TokenRefreshFailure
        expr: increase(kis_token_refresh_failures_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "KIS token refresh failed in last 5m"
          description: "03:30 KST 정시 갱신 실패. 04:30 cutoff 전에 수동 확인."

      - alert: KafkaBrokerInRateMismatch
        expr: |
          abs(
            sum(60 * rate(kis_messages_published_total[5m]))
            -
            60 * sum(kafka_broker_messagesinpersec_rate)
          ) > 500
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "Producer publish rate vs Kafka broker in rate diff > 500/min"
          description: "Producer 가 Kafka 에 publish 하는데 broker 가 못 받는 중. aiokafka backlog 또는 broker pressure."

  - name: tickberg-1b
    interval: 30s
    rules:
      - alert: KisTokenRefreshFailingTrend
        expr: increase(kis_token_refresh_failures_total[1h]) > 3
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Token refresh failed > 3 times in last 1h"
          description: "spec §6.1.1 04:30 cutoff 위험 — 수동 재발급 검토. TokenRefreshFailure (즉시 알림) 와 보완: hourly trend."

      - alert: KisParseErrorBurstSustained
        expr: increase(kis_parse_errors_total[10m]) > 100
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Parse errors > 100 in 10m sustained 5m"
          description: "KIS payload schema 변경 의심. ProducerParseErrorSpike (5m burst) 와 보완: 10m sustained."

  - name: tickberg-1c
    interval: 30s
    rules:
      - alert: KafkaControllerUnhealthy
        expr: kafka_controller_activecontrollercount != 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "KRaft active controller count != 1"
          description: "Controller quorum 손상. =0 이면 metadata 변경 불가, >1 이면 split-brain 상태. producer publish/consumer fetch 즉시 영향."

      - alert: KafkaOfflinePartitions
        expr: kafka_controller_offlinepartitionscount > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Kafka offline partition detected"
          description: "1개 이상 파티션이 leaderless 상태. 해당 파티션의 producer publish 실패 + consumer 읽기 차단. kis.tick.raw 흐름 부분 손실 가능."
