version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AWS_PROFILE: ${AWS_PROFILE:-tickberg}
    AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    S3_BUCKET: ${S3_BUCKET:-tickberg-lakehouse}
  volumes:
    - ../../orchestration/dags:/opt/airflow/dags
    - ../../code:/opt/airflow/code
    - ~/.aws:/home/airflow/.aws:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: tickberg-kafka
    ports: ["9092:9092", "9094:9094"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_KRAFT_CLUSTER_ID: tickberg-kafka-cluster
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999"
    volumes: ["kafka_data:/bitnami/kafka"]
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_JMX_OPTS= kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      retries: 10

  kafka-jmx-exporter:
    image: bitnamilegacy/jmx-exporter:0.20.0
    container_name: tickberg-kafka-jmx
    ports: ["7071:7071"]
    command: ["7071", "/etc/jmx-exporter/kafka.yml"]
    volumes:
      - ../../monitoring/prometheus/jmx_exporter_kafka.yml:/etc/jmx-exporter/kafka.yml:ro
    depends_on: [kafka]

  spark-master:
    build: ./spark
    image: tickberg/spark:3.5.1-iceberg-1.5.2
    container_name: tickberg-spark-master
    env_file: ../../.env
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
    ports: ["7077:7077", "8081:8080"]
    volumes:
      - ../../code:/opt/spark/code
      - ~/.aws:/opt/bitnami/spark/.aws:ro

  spark-worker:
    image: tickberg/spark:3.5.1-iceberg-1.5.2
    container_name: tickberg-spark-worker
    env_file: ../../.env
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on: [spark-master]
    volumes:
      - ../../code:/opt/spark/code
      - ~/.aws:/opt/bitnami/spark/.aws:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tickberg-kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: tickberg-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  airflow-postgres:
    image: postgres:15
    container_name: tickberg-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: ["airflow_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: tickberg-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname a --lastname a --role Admin --email a@a.com || true

  airflow-scheduler:
    <<: *airflow-common
    container_name: tickberg-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: tickberg-airflow-web
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tickberg-prometheus
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: tickberg-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  kis-producer:
    build: ./kis-producer
    container_name: tickberg-kis-producer
    restart: unless-stopped
    env_file: ../../.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: "9100"
      TZ: Asia/Seoul
      KIS_TOKEN_CACHE: /app/data/kis_token.json
    volumes:
      - kis_producer_data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["9100:9100"]

  spark-streaming:
    image: tickberg/spark:3.5.1-iceberg-1.5.2
    container_name: tickberg-spark-streaming
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      - spark-master
      - spark-worker
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_TICK: ${KAFKA_TOPIC_TICK:-kis.tick.raw}
    volumes:
      - ../../code:/opt/spark/code
      - ~/.aws:/opt/bitnami/spark/.aws:ro
    command: >
      spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        --conf spark.driver.host=tickberg-spark-streaming
        --conf spark.driver.port=4041
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.ui.port=4040
        --conf spark.scheduler.mode=FAIR
        --conf spark.scheduler.allocation.file=/opt/bitnami/spark/conf/fairscheduler.xml
        --executor-memory 2g
        --total-executor-cores 2
        /opt/spark/code/pipelines/bronze/bronze_kis_tick_streaming.py
    ports: ["4040:4040"]

volumes:
  kafka_data:
  airflow_postgres_data:
  airflow_logs:
  kis_producer_data:

networks:
  default:
    name: tickberg-net
